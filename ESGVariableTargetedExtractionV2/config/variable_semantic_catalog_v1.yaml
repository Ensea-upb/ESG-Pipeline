# ESG Variable Semantic Catalog v1
# 31 target variables for company x fiscal_year CSV dataset
# Each variable defines retrieval queries, expected units, FP rejection patterns.

# ───────────────────────────────────────────────────────────
# ENVIRONMENTAL (7)
# ───────────────────────────────────────────────────────────

co2_emissions:
  domain: environmental
  expected_value_type: numeric
  query_terms_en:
    - Scope 1 emissions
    - Scope 2 emissions
    - Scope 3 emissions
    - GHG emissions
    - greenhouse gas emissions
    - CO2 equivalent
    - CO2e
    - carbon emissions
    - SF6 emissions
  query_terms_fr:
    - emissions de gaz a effet de serre
    - emissions scope 1
    - emissions scope 2
    - emissions scope 3
    - bilan carbone
    - CO2e
  positive_patterns:
    - scope
    - GHG
    - CO2e
    - emissions
    - SF6
    - greenhouse
    - carbon
    - tCO2
    - ktCO2
    - MtCO2
  negative_patterns:
    - ISO 50001
    - ISO 14001
    - section number
    - footnote
  expected_units:
    - tCO2e
    - ktCO2e
    - MtCO2e
    - tonnes CO2e
    - metric tons CO2e
    - tCO2
    - ktCO2
  forbidden_units:
    - employees
    - sites
    - kWh
    - MWh
    - m3
    - percent
  preferred_doc_types:
    - 01_urd_annual_report
    - 02_sustainability_statement_csrd_esrs
    - 03_climate_report_tcfd_transition_plan
  structural_false_positive_patterns:
    - "ISO \\d{5}"
    - "^\\d{1,2}\\.\\d{1,2}$"
    - "^\\d{1,3}$"
  minimum_relevance_score: 0.10
  extraction_notes: "SF6 leaks should be classified here, not water. Scope 3 upstream/downstream must both map here."

