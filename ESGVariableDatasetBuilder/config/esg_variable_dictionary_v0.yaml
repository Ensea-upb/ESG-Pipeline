schema_version: "0.1"
source_policy: "pdf_corpus_only"
no_external_sources: true
no_esg_score: true
missing_default_status: "missing_from_corpus"
variables:
  - variable_name: co2_emissions
    variable_family: environment
    variable_domain: climate
    definition: Total greenhouse gas or CO2 equivalent emissions disclosed in corpus PDFs.
    expected_type: numeric
    expected_unit: tCO2e
    accepted_units: [tCO2e, ktCO2e, MtCO2e, tonnes CO2e, tons CO2e]
    keywords_en: [ghg emissions, greenhouse gas, co2 emissions, scope 1, scope 2, scope 3, emissions]
    keywords_fr: [emissions ges, gaz a effet de serre, emissions co2, scope 1, scope 2, scope 3]
    mapped_indicator_families: [ghg_emissions, climate]
    mapped_indicator_keys: [ghg, scope_1, scope_2, scope_3, co2]
    priority_rules: [human_review, corrected_value, table_cell, text_quote]
    missing_rule: missing_from_corpus when no PDF evidence is available.
    multiple_values_rule: conflicting_values when incompatible numeric emissions are present.
  - variable_name: carbon_intensity
    variable_family: environment
    variable_domain: climate
    definition: Carbon emissions intensity disclosed in corpus PDFs.
    expected_type: numeric
    expected_unit: intensity
    accepted_units: [tCO2e/revenue, tCO2e/unit, kgCO2e/unit, intensity]
    keywords_en: [carbon intensity, emissions intensity, co2 intensity]
    keywords_fr: [intensite carbone, intensite des emissions]
    mapped_indicator_families: [carbon_intensity, climate]
    mapped_indicator_keys: [carbon_intensity, emissions_intensity]
    priority_rules: [human_review, corrected_value, table_cell, text_quote]
    missing_rule: missing_from_corpus when no PDF evidence is available.
    multiple_values_rule: conflicting_values for incompatible intensity values.
