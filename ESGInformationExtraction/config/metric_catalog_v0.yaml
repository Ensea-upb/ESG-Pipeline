# ESGInformationExtraction — catalogue de métriques ESG v0
# Version initiale couvrant les indicateurs les plus fréquents dans les rapports
# de durabilité, DPEF, CSRD et rapports annuels de grandes entreprises cotées.
#
# Chaque entrée est un metric_name attendu dans MetricRecord.
# Ce catalogue servira de référence pour metric_candidate_extractor.py.
#
# Format :
#   <categorie>:
#     <metric_name>:
#       label_fr: <libellé français>
#       label_en: <libellé anglais>
#       unit_expected: <unité cible normalisée>
#       keywords_fr: [<mots-clés>]
#       keywords_en: [<mots-clés>]
#       scope: <portée habituelle>  # ex: scope_1, scope_2, total, board, etc.

